<tr>
    <td class="job-id">{{.ID}}</td>
    <td>{{.Name}}</td>
    <td>{{.Date.Format "02/01/2006 15:04"}}</td>
    <td>
        <span class="status-indicator status-{{.Status}}">{{if eq .Status "pending"}}Pendente{{else if eq .Status "working"}}Em andamento{{else if eq .Status "ok"}}Concluída{{else if eq .Status "failed"}}Falhou{{else}}{{.Status}}{{end}}</span>
    </td>
    <td>
        {{ if eq .Status "ok" }}
            <a href="/download?id={{.ID}}" download class="button download-button">Baixar CSV</a>
        {{ end }}
        <button hx-delete="/delete?id={{.ID}}" 
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="Deseja excluir esta busca?"
                class="delete-button">Excluir</button>
    </td>
</tr>
